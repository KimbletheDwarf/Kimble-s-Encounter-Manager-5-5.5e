<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Conditions and spells</title>
  <link rel="stylesheet" href="popover.css">
  <style>
    body { padding: 6px 8px 8px; }
    #on { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    #on:empty { display: none; }
    #on button { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; font-size: 12px; border-radius: 12px; }
    #on img, #list img { width: 16px; height: 16px; }
    #find { width: 100%; font: inherit; color: var(--text); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; outline: none; }
    #find:focus { border-color: var(--accent); }
    #list { margin-top: 6px; height: 150px; overflow-y: auto; color: var(--muted); }
    #list button { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; }
    #list button.on { background: rgba(187, 153, 255, 0.18); }
    #who { font-size: 12px; color: var(--muted); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div id="who"></div>
  <div id="on"></div>
  <input id="find" type="text" autocomplete="off" spellcheck="false" autofocus>
  <div id="list"></div>
  <script type="module" src="cond-menu.js"></script>
</body>
</html>
